/* ============ NUVEM (Supabase · mesma tabela svc_shared_state do Layouts do SVC) ============ */
const CFG_KEY="kn-painel-sb";
const CFG_PADRAO={url:"https://cjentqthseecgizptyqe.supabase.co",key:"sb_publishable_ca35t-HrAIN5fpJk45P8FQ_10xWlHIV"};
const TABELA="svc_shared_state", P_ESC="esc:", P_HIST="eschist:", K_ORDEM="escpainel:horarios", K_REGRAS="escpainel:regras", K_DIA="escpainel:dia:";
function getCfg(){try{const s=JSON.parse(localStorage.getItem(CFG_KEY)||"{}")||{};return {url:s.url||CFG_PADRAO.url,key:s.key||CFG_PADRAO.key}}catch(e){return {...CFG_PADRAO}}}
function setCfg(v){try{localStorage.setItem(CFG_KEY,JSON.stringify(v))}catch(e){}sb=null}
function loadScript(urls){urls=[].concat(urls);return (async()=>{for(const u of urls){try{await new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.async=true;s.onload=ok;s.onerror=()=>{s.remove();no()};document.head.appendChild(s)});if(window.supabase)return}catch(e){}}throw new Error("A biblioteca do Supabase não carregou")})()}
let sb=null;
async function nuvem(){
  if(sb)return sb;
  if(!window.supabase)await loadScript(["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"]);
  const c=getCfg();sb=window.supabase.createClient(c.url,c.key,{realtime:{params:{eventsPerSecond:2}}});return sb;
}
async function lerTudo(){
  const c=await nuvem();
  const [e,h,o]=await Promise.all([
    c.from(TABELA).select("state_key,payload,updated_at").like("state_key",P_ESC+"%"),
    c.from(TABELA).select("state_key,payload,updated_at").like("state_key",P_HIST+"%").order("updated_at",{ascending:false}).limit(800),
    c.from(TABELA).select("state_key,payload").in("state_key",[K_ORDEM,K_REGRAS])
  ]);
  if(e.error)throw e.error;if(h.error)throw h.error;
  const escalas=e.data.map(r=>({...r.payload,_id:r.state_key.slice(P_ESC.length)})).sort((a,b)=>(a.ordem??999)-(b.ordem??999));
  const historico=h.data.map(r=>({...r.payload,_id:r.state_key.slice(P_HIST.length)})).sort((a,b)=>String(b.em||"").localeCompare(String(a.em||"")));
  const cfgs=Object.fromEntries(((o&&!o.error&&o.data)||[]).map(r=>[r.state_key,r.payload]));
  const ordemHorarios=cfgs[K_ORDEM]&&Array.isArray(cfgs[K_ORDEM].colunas)?cfgs[K_ORDEM].colunas:null;
  const regras=(cfgs[K_REGRAS]&&cfgs[K_REGRAS].permitido)||{};
  return {escalas,historico,ordemHorarios,regras};
}
async function lerChave(k){const c=await nuvem();const {data,error}=await c.from(TABELA).select("payload").eq("state_key",k).maybeSingle();if(error)throw error;return data?data.payload:null}
async function salvarChave(k,payload){const c=await nuvem();const {error}=await c.from(TABELA).upsert({state_key:k,payload,updated_at:new Date().toISOString()},{onConflict:"state_key"});if(error)throw error}
async function salvarOrdemHorarios(colunas){
  const c=await nuvem();const agora=new Date().toISOString();
  const {error}=await c.from(TABELA).upsert({state_key:K_ORDEM,payload:{colunas,em:agora},updated_at:agora},{onConflict:"state_key"});
  if(error)throw error;
}
/* altera uma escala partindo sempre da versão mais nova da nuvem; se outra pessoa salvou no meio, tenta de novo */
async function alterarEscala(id,fn){
  const c=await nuvem();const key=P_ESC+id;
  for(let t=0;t<4;t++){
    const {data,error}=await c.from(TABELA).select("payload,updated_at").eq("state_key",key).maybeSingle();
    if(error)throw error;if(!data)throw new Error("Essa escala não existe mais na nuvem");
    const novo=fn(JSON.parse(JSON.stringify(data.payload)));const agora=new Date().toISOString();
    const r=await c.from(TABELA).update({payload:novo,updated_at:agora}).eq("state_key",key).eq("updated_at",data.updated_at).select("state_key");
    if(r.error)throw r.error;if(r.data&&r.data.length)return novo;
    await new Promise(ok=>setTimeout(ok,250+Math.random()*400));
  }
  throw new Error("Outra pessoa está mexendo nessa escala agora. Tente de novo.");
}
async function registrar(ev){
  const c=await nuvem();const agora=new Date().toISOString();
  const id=agora.replace(/[^0-9]/g,"")+"-"+Math.random().toString(36).slice(2,7);
  const {error}=await c.from(TABELA).insert({state_key:P_HIST+id,payload:{em:agora,...ev},updated_at:agora});
  if(error)throw error;
}
async function importarBackup(dados){
  const c=await nuvem();const agora=new Date().toISOString();
  const linhas=Object.entries(dados.escalas||{}).map(([id,p])=>({state_key:P_ESC+id,payload:p,updated_at:agora}));
  (dados.historico||[]).forEach(h=>{const {id,...resto}=h;linhas.push({state_key:P_HIST+id,payload:resto,updated_at:resto.em||agora})});
  for(let i=0;i<linhas.length;i+=40){const {error}=await c.from(TABELA).upsert(linhas.slice(i,i+40),{onConflict:"state_key"});if(error)throw error}
  return linhas.length;
}

/* ============ COBERTURA EM CADEIA ============
   nos: [{id, nome, hora(num), presentes:[{id,nome}], ausentes:[{id,nome}], precisa}]
   extras: [{id, nome, horas:[num]}]
   pode(o,d): a pessoa da hora o pode bater ponto na hora d
   Resolve por fluxo de custo mínimo: cobre o máximo de furos com o menor número de movimentações. */
function resolverCobertura(nos,extras,pode){
  const N=[];const add=()=>N.push([])-1;
  const S=add(),T=add();const E=[];
  const aresta=(u,v,cap,custo,info)=>{const a={u,v,cap,custo,flow:0,info,rev:null};const b={u:v,v:u,cap:0,custo:-custo,flow:0,info:null,rev:a};a.rev=b;N[u].push(a);N[v].push(b);E.push(a);return a};
  const idx={};
  nos.forEach(n=>{idx[n.id]={ent:add(),sai:add()}});
  nos.forEach(n=>{const p=n.presentes.length,b=p-n.precisa,k=idx[n.id];
    if(b>0)aresta(S,k.sai,b,0,{tipo:"sobra",no:n.id});
    if(b<0)aresta(k.ent,T,-b,0,{tipo:"furo",no:n.id});
    const passa=p-Math.max(0,b);if(passa>0)aresta(k.ent,k.sai,passa,0,{tipo:"passa",no:n.id});
  });
  const custoMov=(o,d)=>1000+10*Math.abs(o-d);
  nos.forEach(a=>nos.forEach(b=>{if(a.id!==b.id&&pode(a.hora,b.hora))aresta(idx[a.id].sai,idx[b.id].ent,1e9,custoMov(a.hora,b.hora),{tipo:"mov",de:a.id,para:b.id})}));
  extras.forEach(x=>{const xn=add();aresta(S,xn,1,0,{tipo:"extra",x:x.id});
    nos.forEach(b=>{if((x.horas||[]).includes(b.hora))aresta(xn,idx[b.id].ent,1,custoMov(x.hora??b.hora,b.hora)+1,{tipo:"movx",x:x.id,para:b.id})})});
  /* caminhos mais baratos sucessivos (Bellman-Ford; o grafo é pequeno) */
  for(;;){
    const dist=new Array(N.length).fill(Infinity),pre=new Array(N.length).fill(null);dist[S]=0;
    for(let it=0;it<N.length;it++){let mudou=false;
      for(let u=0;u<N.length;u++){if(dist[u]===Infinity)continue;
        for(const e of N[u]){if(e.cap-e.flow>0&&dist[u]+e.custo<dist[e.v]){dist[e.v]=dist[u]+e.custo;pre[e.v]=e;mudou=true}}}
      if(!mudou)break}
    if(dist[T]===Infinity)break;
    let f=Infinity;for(let v=T;v!==S;v=pre[v].u)f=Math.min(f,pre[v].cap-pre[v].flow);
    for(let v=T;v!==S;v=pre[v].u){pre[v].flow+=f;pre[v].rev.flow-=f}
  }
  /* desmonta o fluxo em cadeias, do furo até quem fecha a cadeia */
  const resto=new Map();E.forEach(e=>resto.set(e,Math.max(0,e.flow)));
  const entram=v=>E.filter(e=>e.v===v&&resto.get(e)>0);
  const byId=Object.fromEntries(nos.map(n=>[n.id,n]));const exById=Object.fromEntries(extras.map(x=>[x.id,x]));
  const usados=new Set(),rotAus={};nos.forEach(n=>rotAus[n.id]=0);
  const pegaPessoa=no=>{const p=byId[no].presentes.find(x=>!usados.has(x.id));if(p)usados.add(p.id);return p||{id:"?",nome:"(alguém da escala)"}};
  const cadeias=[];
  E.filter(e=>e.info&&e.info.tipo==="furo").forEach(ef=>{
    for(let k=0;k<resto.get(ef);k++){
      const dno=ef.info.no;const j=rotAus[dno]++;const mot=(byId[dno].motivos||[])[j]||null;
      const passos=[];let v=idx[dno].ent;let fechou=null;
      for(let guard=0;guard<200;guard++){
        const e=entram(v)[0];if(!e)break;resto.set(e,resto.get(e)-1);
        if(e.info.tipo==="mov"){const quem=pegaPessoa(e.info.de);passos.push({pessoa:quem,de:e.info.de,para:e.info.para});v=idx[e.info.de].sai;continue}
        if(e.info.tipo==="movx"){const x=exById[e.info.x];usados.add(x.id);passos.push({pessoa:{id:x.id,nome:x.nome},extra:true,origem:x.origem||"extra",hora:x.hora,para:e.info.para});const ex=entram(e.u)[0];if(ex)resto.set(ex,resto.get(ex)-1);fechou="extra";break}
        if(e.info.tipo==="passa"){v=e.u;continue}
        if(e.info.tipo==="sobra"){fechou="sobra";passos.length&&(passos[passos.length-1].excedente=true);break}
      }
      if(fechou)cadeias.push({furo:{no:dno,mot},passos});
    }
  });
  const furos=nos.reduce((s,n)=>s+Math.max(0,n.precisa-n.presentes.length),0);
  const cobertos=cadeias.length;
  const semCobertura=nos.map(n=>({no:n.id,faltam:Math.max(0,n.precisa-n.presentes.length)-cadeias.filter(c=>c.furo.no===n.id).length,motivos:(n.motivos||[]).slice(rotAus[n.id],Math.max(0,n.precisa-n.presentes.length))})).filter(x=>x.faltam>0);
  const movs=cadeias.reduce((s,c)=>s+c.passos.length,0);
  return {cadeias,furos,cobertos,semCobertura,movs};
}


/* ============ REGRAS ============ */
const MOTIVOS_SAIDA=["Demissão","Mudança de cargo","INSS","Pediu desligamento","Desistiu","Afastamento","Férias","Outro"];
const TOM={"Demissão":"red","Pediu desligamento":"red","Desistiu":"red","INSS":"amber","Afastamento":"amber","Férias":"amber","Mudou de escala":"accent","Mudança de cargo":"amber","ABS lançado":"red","ABS ajustado":"red","Falta marcada":"red","Falta desmarcada":"muted","Escala de folga":"amber","Folga desmarcada":"muted","Veio na folga":"amber","Pulmão: entrou":"amber","Pulmão: saiu":"muted","Troca lançada":"accent","Troca desfeita":"muted","Atribuído na Meli":"green","Atribuição desmarcada":"muted","Sugestão aplicada":"accent","Precisa ajustado":"accent","Adicionado":"accent","Adicionado em lote":"accent","Restaurado":"green","Renomeada":"accent","Pendências importadas":"accent","Planilha puxada":"green"};
const norm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const soDig=s=>(s||"").replace(/\D/g,"");
const fmtCpf=s=>{const d=soDig(s);return d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4"):(s||"").trim()};
function cpfValido(c){if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;for(const k of [9,10]){let s=0;for(let i=0;i<k;i++)s+=+c[i]*(k+1-i);if(((s*10)%11)%10!==+c[k])return false}return true}
const novoId=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const previstoDe=g=>typeof g.previsto==="number"?g.previsto:(g.pessoas||[]).length;
function situacao(n,p){return n<p?{tom:"red",txt:`faltam ${p-n}`}:n>p?{tom:"amber",txt:`${n-p} a mais`}:{tom:"green",txt:"completo"}}
const corTom=t=>({red:"var(--red)",amber:"var(--amber)",green:"var(--green)",accent:"var(--accent)"}[t]||"var(--muted)");
const fundoTom=t=>({red:"color-mix(in srgb,var(--red) 13%,transparent)",amber:"color-mix(in srgb,var(--amber) 13%,transparent)",green:"color-mix(in srgb,var(--green) 12%,transparent)",accent:"color-mix(in srgb,var(--accent) 13%,transparent)"}[t]||"var(--wash)");
const CPF_RE=/(\d{3})[.\s]?(\d{3})[.\s]?(\d{3})[-.\s]?(\d{2})(?!\d)/;
function lerLista(texto,escalas){
  const existentes=new Map();escalas.forEach(g=>(g.pessoas||[]).forEach(p=>{const d=soDig(p.cpf);if(d)existentes.set(d,g.code)}));
  const vistos=new Set(),out=[];
  texto.split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();if(!l)return;
    if(/^(nome|name)\b/i.test(l)&&!/\d/.test(l))return;
    const m=l.match(CPF_RE);let d="",nome=l;
    if(m){d=m.slice(1,5).join("");nome=l.replace(m[0]," ")}
    nome=nome.replace(/^\s*\d{1,3}\s*[-.)–]\s+/,"").replace(/[\t;|,]+/g," ").replace(/\s[-–]\s/g," ").replace(/\s+/g," ").trim().replace(/^[-–:]+|[-–:]+$/g,"").trim();
    const it={nome,cpf:d?fmtCpf(d):"",ok:true,erro:"",aviso:""};
    if(!nome){it.ok=false;it.erro="Sem nome nesta linha"}
    else if(d&&!cpfValido(d)){it.ok=false;it.erro="CPF inválido, confira os números"}
    else if(d&&existentes.has(d)){it.ok=false;it.erro=`Esse CPF já está em ${existentes.get(d)}`}
    else if(d&&vistos.has(d)){it.ok=false;it.erro="CPF repetido na lista colada"}
    else if(!d)it.aviso="Sem CPF, dá para completar depois em Editar";
    if(d)vistos.add(d);out.push(it);
  });
  return out;
}

const campo="w-full bg-[var(--wash)] border border-line rounded-2xl px-3.5 py-2.5 text-[14px] outline-none focus:border-[var(--accent)] transition-colors placeholder:text-[var(--ph)]";

function Nav({view,setView,status,onSync,onCfg,tema,setTema}){
  const tabs=[["escalas","Escalas"],["antigas",html`<span class="sm:hidden">Antigas</span><span class="hidden sm:inline">Escalas antigas</span>`],["cobertura","Cobertura"],["historico","Histórico"],["grupos","GRUPOS"]];
  const st=status.ok===null?{c:"#64748b",t:"conectando…"}:!status.ok?{c:"#dc2626",t:"sem nuvem"}:status.busy?{c:"#d97706",t:"salvando…"}:{c:"#16a34a",t:"ao vivo · "+status.at};
  return html`<header class="fixed top-0 inset-x-0 z-50" style=${{paddingTop:"env(safe-area-inset-top,0px)"}}>
    <div class="glass !border-x-0 !border-t-0" style=${{background:"var(--navbg)"}}>
      <nav class="max-w-7xl mx-auto px-4 h-14 flex items-center gap-3">
        <div class="flex items-center gap-2 shrink-0">
          <span class="w-2 h-2 rounded-full" style=${{background:"var(--accent)",boxShadow:"0 0 12px var(--accent)"}}></span>
          <span class="font-display text-[13px] tracking-tight">KN<span class="text-muted font-sans font-medium hidden sm:inline"> · Painel</span></span>
        </div>
        <button type="button" onClick=${onSync} title="Sincronizar agora" class="hidden sm:inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full text-white" style=${{background:st.c}}>● ${st.t}</button>
        <${LayoutGroup} id="tabs">
          <div class="ml-auto flex gap-1 overflow-x-auto noscroll p-1 rounded-full" style=${{background:"var(--wash)"}} role="tablist">
            ${tabs.map(([k,t])=>html`<button key=${k} id=${"tab-"+k} role="tab" type="button" aria-selected=${k===view} onClick=${()=>setView(k)}
              class=${"relative shrink-0 px-2.5 sm:px-4 py-1.5 rounded-full text-[12.5px] sm:text-[13px] font-medium transition-colors "+(k===view?"text-[var(--on-pill)]":"text-muted hover:text-ink")}>
              ${k===view&&html`<${motion.span} layoutId="pill" class="absolute inset-0 rounded-full" style=${{background:"var(--pill)"}} transition=${spring}/>`}
              <span class="relative">${t}</span></button>`)}
          </div>
        </${LayoutGroup}>
        <button type="button" onClick=${()=>setTema(tema==="claro"?"escuro":"claro")} aria-label=${tema==="claro"?"Usar versão escura":"Usar versão clara"} title=${tema==="claro"?"Versão escura":"Versão clara"} class="shrink-0 w-9 h-9 rounded-full text-muted hover:text-ink" style=${{background:"var(--wash)"}}>${tema==="claro"?"☾":"☀"}</button>
        <button type="button" onClick=${onCfg} aria-label="Configurações" title="Configurações e backup" class="shrink-0 w-9 h-9 rounded-full text-muted hover:text-ink" style=${{background:"var(--wash)"}}>⚙</button>
      </nav>
    </div>
  </header>`;
}

function Stepper({g,podeEditar,onSalvar}){
  const real=previstoDe(g);const [v,setV]=useState(null);const tm=useRef(null);const base=useRef(real);
  useEffect(()=>{if(v===null)base.current=real},[real,v]);
  const mudar=d=>{const novo=Math.max(0,(v??real)+d);setV(novo);clearTimeout(tm.current);
    tm.current=setTimeout(async()=>{const antes=base.current;if(novo!==antes){await onSalvar(antes,novo)}setV(null)},900)};
  const atual=v??real;const s=situacao((g.pessoas||[]).length,atual);
  return html`<div class="flex items-center gap-3 flex-wrap text-[13px] text-muted">
    <span>Quantidade prevista</span>
    ${podeEditar?html`<span class="inline-flex items-center rounded-full border border-line overflow-hidden" style=${{background:"var(--wash)"}}>
      <button type="button" aria-label=${"Diminuir quantidade de "+g.code} disabled=${atual<=0} onClick=${()=>mudar(-1)} class="w-9 h-8 text-lg font-bold disabled:opacity-30" style=${{color:"var(--accent)"}}>−</button>
      <output class="min-w-[40px] text-center font-mono text-[15px] text-ink tnum">${atual}</output>
      <button type="button" aria-label=${"Aumentar quantidade de "+g.code} onClick=${()=>mudar(1)} class="w-9 h-8 text-lg font-bold" style=${{color:"var(--accent)"}}>+</button>
    </span>`:html`<b class="text-ink tnum">${atual}</b>`}
    <${Pill} tom=${s.tom}>${s.txt}</${Pill}>
  </div>`;
}

function FormPessoa({inicial,escalas,novo,onCancelar,onSalvar}){
  const [f,setF]=useState(inicial);const [busy,setBusy]=useState(false);const ref=useRef(null);
  useEffect(()=>{ref.current&&ref.current.focus()},[]);
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const salvar=async()=>{setBusy(true);try{await onSalvar(f)}finally{setBusy(false)}};
  return html`<div class="rounded-2xl p-3.5 my-2 border" style=${{background:"color-mix(in srgb,var(--accent) 6%,transparent)",borderColor:"color-mix(in srgb,var(--accent) 25%,transparent)"}} onKeyDown=${e=>{if(e.key==="Escape")onCancelar()}}>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
      <label class="sm:col-span-2 text-[11px] text-muted grid gap-1">Nome<input ref=${ref} id="f-nome" class=${campo} value=${f.nome} onInput=${set("nome")} autocomplete="off"/></label>
      <label class="text-[11px] text-muted grid gap-1">CPF<input id="f-cpf" class=${campo+" font-mono"} inputmode="numeric" value=${f.cpf} onInput=${set("cpf")} autocomplete="off"/></label>
      <label class="text-[11px] text-muted grid gap-1">Escala<select id="f-destino" class=${campo} value=${f.destino} onChange=${set("destino")}>${escalas.map(g=>html`<option key=${g._id} value=${g._id}>${g.code}</option>`)}</select></label>
      <label class="sm:col-span-2 text-[11px] text-muted grid gap-1">Observação<input id="f-obs" class=${campo} value=${f.obs} onInput=${set("obs")} placeholder="Opcional" autocomplete="off"/></label>
      <label class="sm:col-span-2 text-[11px] text-muted grid gap-1">Motivo da mudança (vai para o Histórico)<input id="f-motivo" class=${campo} value=${f.motivo} onInput=${set("motivo")} placeholder="Ex.: troca de turno a pedido do coordenador" autocomplete="off"/></label>
    </div>
    <div class="flex justify-end gap-2 mt-3 flex-wrap"><${BtnSec} onClick=${onCancelar}>Cancelar</${BtnSec}><${BtnPrim} disabled=${busy} onClick=${salvar}>${busy?"Salvando…":novo?"Adicionar":"Salvar"}</${BtnPrim}></div>
  </div>`;
}

function ConfirmaSaida({p,g,onCancelar,onConfirmar}){
  const [motivo,setMotivo]=useState("");const [nota,setNota]=useState("");const [busy,setBusy]=useState(false);const [erro,setErro]=useState("");
  const ir=async()=>{if(!motivo){setErro("Escolha o motivo antes de tirar a pessoa.");return}setBusy(true);try{await onConfirmar(motivo,nota.trim())}finally{setBusy(false)}};
  return html`<div class="rounded-2xl p-3.5 my-2 border" style=${{background:"color-mix(in srgb,var(--red) 7%,transparent)",borderColor:"color-mix(in srgb,var(--red) 30%,transparent)"}}>
    <div class="text-[14px] font-medium">Tirar ${p.nome} de ${g.code}?</div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2.5">
      <select id="x-motivo" aria-label="Motivo" class=${campo} value=${motivo} onChange=${e=>{setMotivo(e.target.value);setErro("")}}><option value="">Escolha o motivo…</option>${MOTIVOS_SAIDA.map(m=>html`<option key=${m} value=${m}>${m}</option>`)}</select>
      <input id="x-nota" class=${campo} placeholder="Observação (opcional)" value=${nota} onInput=${e=>setNota(e.target.value)} autocomplete="off"/>
    </div>
    ${erro&&html`<div class="text-[12px] mt-2" style=${{color:"var(--red)"}}>${erro}</div>`}
    <div class="flex justify-end gap-2 mt-3 flex-wrap"><${BtnSec} onClick=${onCancelar}>Cancelar</${BtnSec}><${BtnPrim} perigo disabled=${busy} onClick=${ir}>${busy?"Tirando…":"Tirar da escala"}</${BtnPrim}></div>
  </div>`;
}

function ColarLista({g,escalas,onCancelar,onAdicionar}){
  const [t,setT]=useState("");const [busy,setBusy]=useState(false);const ref=useRef(null);
  useEffect(()=>{ref.current&&ref.current.focus()},[]);
  const itens=useMemo(()=>lerLista(t,escalas),[t,escalas]);const ok=itens.filter(i=>i.ok);
  const ir=async()=>{setBusy(true);try{await onAdicionar(ok)}finally{setBusy(false)}};
  return html`<div class="rounded-2xl p-3.5 mt-3 border grid gap-3" style=${{background:"color-mix(in srgb,var(--accent) 6%,transparent)",borderColor:"color-mix(in srgb,var(--accent) 25%,transparent)"}}>
    <label for="c-texto" class="font-display text-[12px] tracking-wide">Colar nomes e CPFs em ${g.code}</label>
    <textarea ref=${ref} id="c-texto" value=${t} onInput=${e=>setT(e.target.value)} rows="6" class=${campo+" font-mono text-[13px] resize-y"}
      placeholder=${"Maria da Silva\t123.456.789-09\nJoão Souza;98765432100\n111.444.777-35 - Ana Lima"}></textarea>
    ${itens.length?html`<div class="text-[12px] text-muted"><b class="text-ink">${ok.length}</b> pronta(s) para adicionar${itens.length-ok.length?html` · <span style=${{color:"var(--red)"}}>${itens.length-ok.length} com problema (não entram)</span>`:""}</div>
      <div class="rounded-2xl border border-line overflow-y-auto max-h-64" style=${{background:"var(--wash)"}}>
        ${itens.map((i,n)=>html`<div key=${n} class="grid grid-cols-[1fr_auto] gap-x-3 px-3 py-2 border-t border-[var(--sep)] first:border-t-0 text-[13px]">
          <span class="min-w-0 truncate">${i.nome||"—"}</span><span class="font-mono text-muted">${i.cpf||"sem CPF"}</span>
          ${i.erro&&html`<span class="col-span-2 text-[11px]" style=${{color:"var(--red)"}}>${i.erro}</span>`}
          ${i.aviso&&html`<span class="col-span-2 text-[11px]" style=${{color:"var(--amber)"}}>${i.aviso}</span>`}
        </div>`)}
      </div>`:html`<div class="text-[12px] text-muted">Uma pessoa por linha, com nome e CPF em qualquer ordem. Pode copiar direto do Excel ou do Sheets.</div>`}
    <div class="flex justify-end gap-2 flex-wrap"><${BtnSec} onClick=${onCancelar}>Cancelar</${BtnSec}><${BtnPrim} disabled=${busy||!ok.length} onClick=${ir}>${busy?"Adicionando…":`Adicionar ${ok.length||""} em ${g.code}`}</${BtnPrim}></div>
  </div>`;
}

function Pessoa({p,i,g,escalas,acao,setAcao,podeEditar,ops}){
  const [copiado,setCopiado]=useState(false);
  const copiar=async()=>{try{await navigator.clipboard.writeText(p.cpf);setCopiado(true);setTimeout(()=>setCopiado(false),1300)}catch(e){}};
  if(acao&&acao.tipo==="editar"&&acao.id===p.id)return html`<${FormPessoa} inicial=${{nome:p.nome,cpf:p.cpf,obs:p.obs||"",destino:g._id,motivo:""}} escalas=${escalas}
    onCancelar=${()=>setAcao(null)} onSalvar=${f=>ops.salvarPessoa(g,p,f)}/>`;
  if(acao&&acao.tipo==="sair"&&acao.id===p.id)return html`<${ConfirmaSaida} p=${p} g=${g} onCancelar=${()=>setAcao(null)} onConfirmar=${(m,n)=>ops.tirar(g,p,m,n)}/>`;
  return html`<div class="flex items-center gap-3 py-2.5 border-t border-[var(--sep)] first:border-t-0 flex-wrap sm:flex-nowrap">
    <span class="font-mono text-[11px] text-muted tnum w-6 shrink-0">${String(i+1).padStart(2,"0")}</span>
    <div class="min-w-0 flex-1">
      <div class="text-[14px] font-medium break-words">${p.nome}${p.obs&&html` <span class="inline-block align-middle ml-1"><${Pill} tom="amber">${p.obs}</${Pill}></span>`}</div>
      <div class="font-mono text-[12px] text-muted tnum mt-0.5">${p.cpf||"sem CPF"}</div>
    </div>
    <div class="flex gap-1.5 flex-wrap pl-9 sm:pl-0">
      ${p.cpf&&html`<${BtnMini} onClick=${copiar}>${copiado?"Copiado":"Copiar CPF"}</${BtnMini}>`}
      ${podeEditar&&html`<${BtnMini} onClick=${()=>setAcao({tipo:"editar",id:p.id})}>Editar</${BtnMini}><${BtnMini} perigo onClick=${()=>setAcao({tipo:"sair",id:p.id})}>Excluir</${BtnMini}>`}
    </div>
  </div>`;
}

function Renomear({g,podeEditar,onSalvar}){
  const [ed,setEd]=useState(false);const [v,setV]=useState(g.code);const [busy,setBusy]=useState(false);
  if(!podeEditar)return null;
  if(!ed)return html`<div class="mb-2"><${BtnMini} onClick=${()=>{setV(g.code);setEd(true)}}>✎ Renomear escala</${BtnMini}></div>`;
  const ir=async()=>{setBusy(true);const ok=await onSalvar(v.trim());setBusy(false);if(ok)setEd(false)};
  return html`<div class="flex gap-2 items-center flex-wrap mb-3">
    <label for=${"ren-"+g._id} class="text-[12px] text-muted">Nome da escala</label>
    <input id=${"ren-"+g._id} class=${campo+" !w-40 font-display"} value=${v} onInput=${e=>setV(e.target.value)} onKeyDown=${e=>{if(e.key==="Enter")ir();if(e.key==="Escape")setEd(false)}} autocomplete="off"/>
    <${BtnSec} onClick=${()=>setEd(false)}>Cancelar</${BtnSec}><${BtnPrim} disabled=${busy} onClick=${ir}>${busy?"Salvando…":"Salvar"}</${BtnPrim}>
  </div>`;
}
function Escala({g,escalas,aberta,toggle,filtro,acao,setAcao,podeEditar,ops}){
  const f=norm(filtro.trim()),fd=soDig(filtro);const ps=g.pessoas||[];
  const hitCode=f&&norm(g.code).includes(f);
  const itens=(!f||hitCode)?ps:ps.filter(p=>norm(p.nome).includes(f)||(fd.length>=3&&soDig(p.cpf).includes(fd)));
  const minha=acao&&acao.escala===g._id;
  if(f&&!itens.length&&!minha)return null;
  const open=aberta||!!f||minha;
  const sub=g.tipo==="cargo"?(ps.length?"Liderança e apoio":"Liderança e apoio · ainda sem nomes"):(g.turno||"Turno não informado");
  return html`<div id=${"esc-"+g._id} class="rounded-2xl border border-line overflow-hidden scroll-mt-28" style=${{background:"var(--wash)"}}>
    <button type="button" onClick=${toggle} aria-expanded=${open?"true":"false"} class="w-full flex items-center gap-3 px-4 py-3.5 text-left hover:bg-[var(--wash)] transition-colors">
      <${motion.span} animate=${{rotate:open?90:0}} transition=${spring} class="w-6 h-6 rounded-lg grid place-items-center text-[10px] shrink-0" style=${{background:"color-mix(in srgb,var(--accent) 13%,transparent)",color:"var(--accent)"}}>▶</${motion.span}>
      <span class="min-w-0 flex-1"><span class="block font-display text-[16px] tracking-tight tnum">${g.code}</span><span class="block text-[12px] text-muted mt-0.5 truncate">${sub}</span></span>
      <span class="font-mono text-[12px] px-2.5 py-1 rounded-full tnum shrink-0" style=${{background:"color-mix(in srgb,var(--accent) 12%,transparent)",color:"var(--accent)"}}>${f&&itens.length!==ps.length?itens.length+" de ":""}${ps.length} ${ps.length===1?"pessoa":"pessoas"}</span>
    </button>
    <${AnimatePresence} initial=${false}>${open&&html`<${motion.div} key="b" ...${abrir} class="overflow-hidden">
      <div class="px-4 pb-4">
        <${Renomear} g=${g} podeEditar=${podeEditar} onSalvar=${n=>ops.renomear(g,n)}/>
        ${(g.coords||[]).length>0&&html`<div class="text-[12px] text-muted mb-2">Coord.: ${g.coords.join(", ")}</div>`}
        <div class="mb-2"><${Stepper} g=${g} podeEditar=${podeEditar} onSalvar=${(a,n)=>ops.previsto(g,a,n)}/></div>
        <div>${itens.map((p,i)=>html`<${Pessoa} key=${p.id} p=${p} i=${i} g=${g} escalas=${escalas} acao=${acao} setAcao=${setAcao} podeEditar=${podeEditar} ops=${ops}/>`)}</div>
        ${!ps.length&&html`<div class="text-[13px] text-muted py-2">Ninguém nessa escala ainda.</div>`}
        ${minha&&acao.tipo==="novo"&&html`<${FormPessoa} novo inicial=${{nome:"",cpf:"",obs:"",destino:g._id,motivo:""}} escalas=${escalas} onCancelar=${()=>setAcao(null)} onSalvar=${f=>ops.salvarPessoa(g,null,f)}/>`}
        ${minha&&acao.tipo==="colar"&&html`<${ColarLista} g=${g} escalas=${escalas} onCancelar=${()=>setAcao(null)} onAdicionar=${it=>ops.colar(g,it)}/>`}
        ${podeEditar&&!(minha&&(acao.tipo==="novo"||acao.tipo==="colar"))&&html`<div class="flex gap-2 flex-wrap mt-3">
          <${BtnMini} onClick=${()=>setAcao({tipo:"novo",escala:g._id})}>+ Adicionar pessoa</${BtnMini}>
          <${BtnMini} onClick=${()=>setAcao({tipo:"colar",escala:g._id})}>Colar lista de nome e CPF</${BtnMini}>
        </div>`}
      </div>
    </${motion.div}>`}</${AnimatePresence}>
  </div>`;
}

function Totais({escalas}){
  const ops=escalas.filter(g=>g.tipo!=="cargo"),car=escalas.filter(g=>g.tipo==="cargo");
  const n=a=>a.reduce((s,g)=>s+(g.pessoas||[]).length,0),p=a=>a.reduce((s,g)=>s+previstoDe(g),0);
  const nt=n(escalas),pt=p(escalas),s=situacao(nt,pt);
  const mini=(rot,a)=>{const x=n(a),y=p(a),z=situacao(x,y);return html`<div class="min-w-0"><div class="font-display text-2xl sm:text-3xl tnum"><${CountUp} v=${x}/><span class="text-muted font-sans text-sm"> de ${y}</span></div><div class="text-muted text-xs mt-1">${rot}</div><div class="text-[11px] mt-0.5" style=${{color:corTom(z.tom)}}>${z.txt}</div></div>`};
  return html`<${Card} className="md:col-span-8">
    <div class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">Headcount KN 2026 · Rostering</div>
    <div class="flex items-end gap-4 flex-wrap mt-2 mb-6">
      <h1 class="font-display text-5xl sm:text-7xl tracking-tight tnum leading-none"><${CountUp} v=${nt}/></h1>
      <div class="pb-1"><div class="text-[15px]">pessoas em todas as escalas</div><div class="text-[13px]"><span class="text-muted">previsto ${pt} · </span><span style=${{color:corTom(s.tom)}}>${s.txt}</span></div></div>
    </div>
    <div class="grid grid-cols-2 gap-4 max-w-md">
      ${mini(`Escalas operacionais · ${ops.length}`,ops)}
      ${car.length>0&&mini(`Liderança e apoio · ${car.length}`,car)}
    </div>
  </${Card}>`;
}

function Busca({filtro,setFiltro,onAbrir,onFechar,achados}){
  return html`<${Card} className="md:col-span-4" title="Buscar">
    <label for="busca" class="sr-only">Escala, nome ou CPF</label>
    <input id="busca" type="search" value=${filtro} onInput=${e=>setFiltro(e.target.value)} placeholder="Escala, nome ou CPF" autocomplete="off"
      class="w-full bg-[var(--wash)] border border-line rounded-2xl px-4 py-3 font-display text-lg placeholder:text-[var(--ph)] outline-none focus:border-[var(--accent)] transition-colors"/>
    <div class="text-[12px] text-muted mt-3 min-h-[18px]">${filtro.trim()?(achados?`${achados} pessoa(s) encontrada(s)`:"Ninguém encontrado"):"Digite parte do nome, o código da escala ou o CPF."}</div>
    <div class="flex gap-2 mt-3 flex-wrap"><${BtnMini} onClick=${onAbrir}>Abrir todas</${BtnMini}><${BtnMini} onClick=${onFechar}>Fechar todas</${BtnMini}></div>
  </${Card}>`;
}

function EscalasView({escalas,podeEditar,ops,carregando,onCfg,foco}){
  const [filtro,setFiltro]=useState("");const [abertas,setAbertas]=useState(()=>new Set(foco?[foco.id]:[]));
  useEffect(()=>{if(!foco||carregando)return;setAbertas(s=>new Set(s).add(foco.id));const t=setTimeout(()=>{const el=document.getElementById("esc-"+foco.id);el&&el.scrollIntoView({behavior:"smooth",block:"start"})},350);return()=>clearTimeout(t)},[foco,carregando]);const [acao,setAcaoRaw]=useState(null);
  const setAcao=a=>{setAcaoRaw(a);if(a&&a.escala)setAbertas(s=>new Set(s).add(a.escala))};
  const opsComFim={...ops};["salvarPessoa","tirar","colar"].forEach(k=>opsComFim[k]=async(...a)=>{const ok=await ops[k](...a);if(ok)setAcaoRaw(null)});
  const toggle=id=>setAbertas(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n});
  const f=norm(filtro.trim()),fd=soDig(filtro);
  const achados=f?escalas.reduce((s,g)=>s+(g.pessoas||[]).filter(p=>norm(g.code).includes(f)||norm(p.nome).includes(f)||(fd.length>=3&&soDig(p.cpf).includes(fd))).length,0):0;
  if(carregando)return html`<div class="grid grid-cols-1 md:grid-cols-12 gap-4">
    <div class="glass rounded-3xl p-6 md:col-span-8 h-48"><div class="sk h-3 w-24 mb-5"></div><div class="sk h-12 w-1/3 mb-3"></div><div class="sk h-3 w-1/2"></div></div>
    <div class="glass rounded-3xl p-6 md:col-span-4 h-48"><div class="sk h-3 w-20 mb-5"></div><div class="sk h-12 w-full"></div></div>
    <div class="glass rounded-3xl p-6 md:col-span-12">${[1,2,3,4,5].map(i=>html`<div key=${i} class="sk h-14 w-full mb-2"></div>`)}</div></div>`;
  if(!escalas.length)return html`<${Card} title="Escalas"><div class="text-[15px] max-w-xl">Ainda não tem nenhuma escala na nuvem. Abra <b>⚙ Configurações</b> e importe o arquivo <span class="font-mono text-[13px]">escalas-dados-iniciais.json</span> para carregar as escalas, as pessoas e o histórico.</div><div class="mt-4"><${BtnPrim} onClick=${onCfg}>Abrir Configurações</${BtnPrim}></div></${Card}>`;
  const ops_=escalas.filter(g=>g.tipo!=="cargo"),car=escalas.filter(g=>g.tipo==="cargo");
  const soma=a=>`${a.reduce((s,g)=>s+(g.pessoas||[]).length,0)} de ${a.reduce((s,g)=>s+previstoDe(g),0)}`;

/* ============ ESCALAS ANTIGAS POR HORÁRIO ============ */
const TURNO_RE=/-\s*([A-Z]\d)\s*-\s*(\d{2})H/;
function rotuloTurno(t){const m=String(t||"").toUpperCase().match(TURNO_RE);return m?{label:`${m[1]} - ${m[2].padStart(2,"0")}h`,hora:`${parseInt(m[2],10)}h`,ord:parseInt(m[2],10)}:null}
const COLUNAS=[["5h","6h"],["8h","13h"],["14h","22h","23h"]];
function montarColunas(base,existentes){
  const vistos=new Set();let cols=(base&&base.length===3?base:COLUNAS).map(c=>c.filter(h=>existentes.includes(h)&&!vistos.has(h)&&vistos.add(h)));
  const faltam=existentes.filter(h=>!vistos.has(h)).sort((a,b)=>parseInt(a)-parseInt(b));
  cols[2]=[...cols[2],...faltam];return cols;
}
function AntigasView({escalas,carregando,irPara,ordem,onSalvarOrdem}){
  const [q,setQ]=useState("");const [org,setOrg]=useState(null);const [arrastando,setArrastando]=useState(null);const [salvando,setSalvando]=useState(false);
  const itens=escalas.filter(g=>g.tipo!=="cargo").map(g=>{const r=rotuloTurno(g.turno);return r?{...r,g,codigo:(g.code==="Sem código"?"—":g.code)}:null}).filter(Boolean);
  const nq=norm(q.trim());
  const vis=nq?itens.filter(x=>norm(`${x.label} ${x.codigo} ${x.hora} ${x.g.turno}`).includes(nq)):itens;
  const grupos={};vis.forEach(x=>(grupos[x.hora]??=[]).push(x));Object.values(grupos).forEach(a=>a.sort((a,b)=>a.label.localeCompare(b.label,"pt",{numeric:true})));
  const todasHoras=[...new Set(itens.map(x=>x.hora))];
  const cols=org||montarColunas(ordem,todasHoras);
  const mover=(h,dc,dp)=>{const c=cols.map(x=>[...x]);const ci=c.findIndex(x=>x.includes(h));const pi=c[ci].indexOf(h);
    if(dc){const ni=ci+dc;if(ni<0||ni>2)return;c[ci].splice(pi,1);c[ni].push(h)}
    else{const np=pi+dp;if(np<0||np>=c[ci].length)return;c[ci].splice(pi,1);c[ci].splice(np,0,h)}setOrg(c)};
  const soltar=(h,ci,antesDe)=>{if(!h)return;const c=cols.map(x=>x.filter(y=>y!==h));const pos=antesDe?c[ci].indexOf(antesDe):-1;if(pos<0)c[ci].push(h);else c[ci].splice(pos,0,h);setOrg(c);setArrastando(null)};
  const concluir=async()=>{setSalvando(true);const ok=await onSalvarOrdem(org);setSalvando(false);if(ok)setOrg(null)};
  const seta=(lbl,fn,dis)=>html`<button type="button" aria-label=${lbl} title=${lbl} disabled=${dis} onClick=${fn} class="w-8 h-8 rounded-full text-[14px] font-bold disabled:opacity-25" style=${{background:"color-mix(in srgb,var(--accent) 13%,transparent)",color:"var(--accent)"}}>${lbl.startsWith("Subir")?"↑":lbl.startsWith("Descer")?"↓":lbl.startsWith("Esquerda")?"←":"→"}</button>`;
  const cartao=(h,ci,pi,tam)=>org?html`<div key=${h} draggable="true" onDragStart=${e=>{setArrastando(h);e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",h)}catch(_){}}} onDragEnd=${()=>setArrastando(null)}
      onDragOver=${e=>e.preventDefault()} onDrop=${e=>{e.preventDefault();e.stopPropagation();soltar(arrastando,ci,h)}}
      class=${"glass rounded-3xl p-3 flex items-center gap-3 cursor-grab active:cursor-grabbing border-dashed "+(arrastando===h?"opacity-40":"")} style=${{borderColor:"color-mix(in srgb,var(--accent) 35%,transparent)"}}>
      <span class="text-muted text-[18px] select-none" aria-hidden="true">⠿</span>
      <span class="font-display text-[18px] w-14" style=${{color:"var(--accent)"}}>${h}</span>
      <span class="text-[12px] text-muted flex-1 min-w-0 truncate">${(grupos[h]||[]).length} escala(s)</span>
      <span class="flex gap-1">${seta("Esquerda: mover "+h+" para a coluna da esquerda",()=>mover(h,-1,0),ci===0)}${seta("Subir "+h,()=>mover(h,0,-1),pi===0)}${seta("Descer "+h,()=>mover(h,0,1),pi===tam-1)}${seta("Direita: mover "+h+" para a coluna da direita",()=>mover(h,1,0),ci===2)}</span>
    </div>`:html`<div key=${h} class="glass rounded-3xl overflow-hidden grid grid-cols-[64px_minmax(0,1fr)]">
    <div class="grid place-items-center font-display text-[15px]" style=${{background:"color-mix(in srgb,var(--accent) 10%,transparent)",color:"var(--accent)"}}>${h}</div>
    <div class="px-3 py-1.5">${grupos[h].map(x=>html`<button type="button" key=${x.g._id} onClick=${()=>irPara(x.g._id)} title=${"Abrir "+x.g.code+" na aba Escalas"}
      class="w-full grid grid-cols-[minmax(0,1fr)_18px_auto] items-center gap-2 min-h-[42px] border-t border-[var(--sep)] first:border-t-0 text-left hover:bg-[var(--wash)] rounded-lg px-1 transition-colors">
      <span class="min-w-0"><span class="block text-[14px] font-semibold tnum">${x.label}</span><span class="block text-[11px] text-muted">${(x.g.pessoas||[]).length} pessoas</span></span>
      <span class="text-center text-muted">→</span>
      <span class="font-mono text-[13px] font-bold px-2.5 py-1 rounded-lg tnum min-w-[62px] text-center" style=${{background:x.codigo==="—"?"color-mix(in srgb,var(--amber) 13%,transparent)":"color-mix(in srgb,var(--accent) 13%,transparent)",color:x.codigo==="—"?"var(--amber)":"var(--accent)",boxShadow:"inset 0 0 0 1px color-mix(in srgb,var(--accent) 18%,transparent)"}}>${x.codigo==="—"?"sem código":x.codigo}</span>
    </button>`)}</div>
  </div>`;
  return html`<${motion.div} key="ant" initial=${{opacity:0,y:8}} animate=${{opacity:1,y:0}} exit=${{opacity:0}} transition=${{duration:.2}} class="grid grid-cols-1 md:grid-cols-12 gap-4">
    <${Card} className="md:col-span-8">
      <div class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">Referência Rostering</div>

      <div class="text-[14px] text-muted max-w-xl">Consulta rápida da escala atual para o código da escala antiga. Toque em uma linha para abrir a escala com as pessoas.</div>
    </${Card}>
    <${Card} className="md:col-span-4" title="Buscar">
      <label for="busca-antiga" class="sr-only">Escala, horário ou código</label>
      <input id="busca-antiga" type="search" value=${q} onInput=${e=>setQ(e.target.value)} placeholder="G1, 08h, 1333, B3…" autocomplete="off"
        class="w-full bg-[var(--wash)] border border-line rounded-2xl px-4 py-3 font-display text-lg placeholder:text-[var(--ph)] outline-none focus:border-[var(--accent)] transition-colors"/>
      <div class="text-[12px] text-muted mt-3">${q.trim()?`${vis.length} escala(s) encontrada(s)`:`${itens.length} escalas operacionais`}</div>
      <div class="mt-3 flex gap-2 flex-wrap">${org?html`<${BtnSec} onClick=${()=>setOrg(null)}>Cancelar</${BtnSec}><${BtnSec} onClick=${()=>setOrg(montarColunas(null,todasHoras))}>Ordem padrão</${BtnSec}><${BtnPrim} disabled=${salvando} onClick=${concluir}>${salvando?"Salvando…":"Salvar ordem"}</${BtnPrim}>`
        :html`<${BtnMini} onClick=${()=>{setQ("");setOrg(cols.map(c=>[...c]))}}>⠿ Organizar horários</${BtnMini}>`}</div>
    </${Card}>
    ${org&&html`<div class="md:col-span-12 rounded-2xl px-4 py-3 text-[13px]" style=${{background:"color-mix(in srgb,var(--accent) 8%,transparent)",color:"var(--ink)"}}>Arraste os horários para onde quiser (no computador) ou use as setas ← ↑ ↓ →. Clique em <b>Salvar ordem</b> para valer para todos.</div>`}
    ${carregando?html`<div class="md:col-span-12 grid grid-cols-1 md:grid-cols-3 gap-4">${[1,2,3].map(i=>html`<div key=${i} class="glass rounded-3xl p-4"><div class="sk h-40 w-full"></div></div>`)}</div>`
      :!vis.length?html`<${Card} className="md:col-span-12"><div class="text-[14px] text-muted">${itens.length?"Nenhuma escala encontrada com essa busca.":"Ainda não tem escalas na nuvem. Importe os dados em ⚙ Configurações."}</div></${Card}>`
      :html`<div class="md:col-span-12 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 items-start">
        ${cols.map((c,i)=>{const vc=org?c:c.filter(h=>grupos[h]);return html`<div key=${i} class=${"flex flex-col gap-4 min-w-0 "+(org?"rounded-3xl p-2 min-h-[120px] border border-dashed border-line":"")}
          onDragOver=${org?e=>e.preventDefault():undefined} onDrop=${org?e=>{e.preventDefault();soltar(arrastando,i,null)}:undefined}>
          ${org&&html`<div class="text-[11px] uppercase tracking-[.14em] text-muted font-semibold px-2 pt-1">Coluna ${i+1}</div>`}
          ${vc.map((h,pi)=>cartao(h,i,pi,vc.length))}</div>`})}

  </${motion.div}>`;
}

const HORAS_NOITE=h=>h>=20;
function regraPadrao(o,d){if(o===d)return true;if(HORAS_NOITE(o)||HORAS_NOITE(d))return HORAS_NOITE(o)&&HORAS_NOITE(d);return Math.abs(o-d)<=5}
const hojeISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const fmtData=iso=>{const [a,m,d]=iso.split("-");return `${d}/${m}/${a}`};
const DIA_VAZIO={precisa:{},folga:{},ausentes:{},extras:[]};

function Mini({children,ativo,onClick,label,tom}){return html`<button type="button" aria-label=${label} aria-pressed=${ativo?"true":"false"} onClick=${onClick}
  class="text-[12px] font-medium px-2.5 py-1 rounded-full border transition-colors" style=${ativo?{background:fundoTom(tom||"accent"),borderColor:"transparent",color:corTom(tom||"accent")}:{borderColor:"var(--line)",color:"var(--muted)"}}>${children}</button>`}

const ORIGEM={folga:"veio na folga",sem:"sem solicitação",extra:"diarista/extra"};
const hh=h=>String(h).padStart(2,"0")+"h";
function LinhaQuadro({n,dia,mudar,podeEditar,log=()=>{}}){
  const [aberto,setAberto]=useState(false);
  const g=n.g;const folga=!!dia.folga[g._id];const aus=new Set(dia.ausentes[g._id]||[]);

  const ajPrecisa=d=>{log({tipo:"Precisa ajustado",nome:"Escala "+g.code,escala:g.code,detalhe:`precisa: ${n.precisa} → ${Math.max(0,n.precisa+d)}`});mudar(x=>({...x,precisa:{...x.precisa,[g._id]:Math.max(0,n.precisa+d)}}))};
  const togAus=pid=>{const p=(g.pessoas||[]).find(z=>z.id===pid)||{};log({tipo:aus.has(pid)?"Falta desmarcada":"Falta marcada",nome:p.nome,cpf:p.cpf,escala:g.code});mudar(x=>{const a=new Set(x.ausentes[g._id]||[]);a.has(pid)?a.delete(pid):a.add(pid);return {...x,ausentes:{...x.ausentes,[g._id]:[...a]}}})};

  const veio=folga?(g.pessoas||[]).filter(p=>noPulmao(p.id)).length:0;

        <b class="tnum min-w-[22px] text-center ${podeEditar?"":"px-2"}">${n.precisa}</b>
        ${podeEditar&&html`<button type="button" aria-label=${"Aumentar necessidade de "+g.code} onClick=${()=>ajPrecisa(1)} class="w-7 h-7 font-bold" style=${{color:"var(--accent)"}}>+</button>`}
      </span>
      <span class="text-[12px] text-muted tnum w-[72px] text-right">vieram <b class="text-ink">${n.presentes.length}</b></span>`}
      ${folga&&veio>0&&html`<${Pill} tom="amber">${veio} no pulmão</${Pill}>`}
      <${Pill} tom=${s.tom}>${s.txt}</${Pill}>

      </div>

function Pulmao({dia,mudar,horas,podeEditar,todos,pode,uso,presentesIds,log=()=>{}}){

    return todos.filter(p=>norm(p.nome).includes(t)||(d.length>=3&&(p.cpf||"").replace(/\D/g,"").includes(d))).slice(0,6)},[q,todos]);
  const escolher=p=>{setSel(p);setHora(p.hora??null);setOrigem("sem");setQ(p.nome)};

    const item=sel?{id:"x"+sel.id,pessoaId:sel.id,nome:sel.nome,hora,origem,escala:sel.code}:{id:"x"+Date.now().toString(36),nome:nomeNovo,hora,origem:"extra"};
    log({tipo:"Pulmão: entrou",nome:item.nome,cpf:sel?sel.cpf:"",escala:item.escala||"",detalhe:`${ORIGEM[item.origem]} · bateu às ${hh(item.hora)}`});mudar(x=>({...x,extras:[...x.extras,item]}));limpar()};
  const horasDe=x=>x.hora!=null?horas.filter(d=>pode(x.hora,d)):(x.horas||[]);
  return html`<${Card} title="Pulmão do dia" right=${html`<span class="text-[12px] text-muted">${dia.extras.length} pessoa(s)</span>`}>

      ${(sel||nomeNovo.length>1)&&html`<div class="grid gap-2 rounded-2xl p-3" style=${{background:"var(--wash)"}}>
        ${sel?html`<div class="text-[12px] text-muted">Escala dele(a): <b class="text-ink">${sel.code} · ${sel.label}</b></div>
          ${jaPresente&&html`<div class="text-[12px]" style=${{color:"var(--amber)"}}>Essa pessoa já conta como presente na escala dela hoje. Marque a escala como folga ou a pessoa como falta antes.</div>`}
          ${jaTem&&html`<div class="text-[12px]" style=${{color:"var(--amber)"}}>Já está no pulmão.</div>`}
          <div class="flex flex-wrap gap-1.5">${["sem","folga"].map(o=>html`<${Mini} key=${o} ativo=${origem===o} tom="amber" label=${ORIGEM[o]} onClick=${()=>setOrigem(o)}>${ORIGEM[o]}</${Mini}>`)}</div>`
        :html`<div class="text-[12px] text-muted">Não está no HC: entra como <b class="text-ink">diarista/extra</b>.</div>`}
        <div class="text-[11px] text-muted">Bateu o ponto às:</div>
        <div class="flex flex-wrap gap-1.5">${horas.map(h=>html`<${Mini} key=${h} ativo=${hora===h} label=${"Bateu às "+h+"h"} onClick=${()=>setHora(h)}>${h}h</${Mini}>`)}</div>
        ${hora!=null&&html`<div class="text-[11px] text-muted">Pode cobrir: ${horas.filter(d=>pode(hora,d)).map(hh).join(", ")||"nenhum horário"}</div>`}

      </div>`}
    </div>`}

/* ---- rótulos dos furos ---- */
const motNome=m=>!m?"Vaga fixa":m.tipo==="abs"?(m.pessoa?m.pessoa.nome:"ABS"):m.tipo==="troca"?`Lugar de ${m.nome} (foi p/ ${m.para})`:m.nome?`Vaga de ${m.nome}${m.motivo?" ("+m.motivo+")":""}`:"Vaga fixa";
const motTag=m=>!m?"ESCALA INCOMPLETA":m.tipo==="abs"?"AUSENTE":m.tipo==="troca"?"TROCA":"ESCALA INCOMPLETA";
const motTom=m=>m&&m.tipo==="troca"?"accent":"red";
const motAnt=m=>!m?"a vaga fixa":m.tipo==="abs"?(m.pessoa?"posição de "+m.pessoa.nome:"a posição do ABS"):m.tipo==="troca"?"o lugar de "+m.nome:m.nome?"a vaga de "+m.nome:"a vaga fixa";
const passoDe=(p,rot)=>p.extra?`pulmão (${ORIGEM[p.origem]||"extra"}${p.hora!=null?" · bateu "+hh(p.hora):""})`:rot(p.de)+(p.excedente?" · excedente":"");

/* ---- cálculo de um dia (quadro, opções e panorama) ---- */
const PRAZO_DIAS=5;
/* os cards de "Furos dos últimos dias" só contam a partir deste dia (início do uso do painel) */
const INICIO_CONTAGEM="2026-10-08";
const isoDe=t=>`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
const addDias=(iso,n)=>{const [a,m,d]=iso.split("-").map(Number);return isoDe(new Date(a,m-1,d+n))};
const difDias=(a,b)=>Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5);
const dm=iso=>{const [,m,d]=iso.split("-");return `${d}/${m}`};
const SEMANA=["dom","seg","ter","qua","qui","sex","sáb"];
const semanaDe=iso=>{const [a,m,d]=iso.split("-").map(Number);return SEMANA[new Date(a,m-1,d).getDay()]};
const dg=s=>String(s||"").replace(/\D/g,"");
function prazoDe(data){const ate=addDias(data,PRAZO_DIAS);const r=difDias(ate,hojeISO());return {ate,r,txt:r<0?"prazo encerrado":r===0?`último dia para atribuir (${dm(ate)})`:`atribuir até ${dm(ate)} · falta${r>1?"m":""} ${r} dia${r>1?"s":""}`,tom:r<0?"muted":r<=1?"red":"amber"}}
/* quem saiu de cada escala e ainda não foi reposto: demissão, INSS, mudança de cargo/escala… */
function mapaSaidas(escalas,historico){
  const porCode={};escalas.forEach(g=>porCode[g.code]=g);
  const ativo=new Set();const em={};escalas.forEach(g=>(g.pessoas||[]).forEach(p=>{const k=dg(p.cpf)||norm(p.nome);ativo.add(k);em[k]=g._id}));
  const m={};const visto=new Set();
  /* troca entre escalas (um sai, outro entra) não abre vaga: cada entrada anula uma saída */
  const entradas={};(historico||[]).forEach(h=>{if(h.tipo==="Mudou de escala"&&h.para)entradas[h.para]=(entradas[h.para]||0)+1});
  (historico||[]).forEach(h=>{const k=dg(h.cpf)||norm(h.nome);
    if(h.tipo==="Removido"){const gid=h.escalaId||(porCode[h.escala]||{})._id;if(!gid||ativo.has(k)||visto.has(k+gid))return;visto.add(k+gid);
      (m[gid]??=[]).push({nome:h.nome,motivo:h.motivo||"saiu"})}
    else if(h.tipo==="Mudou de escala"){const o=porCode[h.escala];if(!o||em[k]===o._id||visto.has(k+o._id))return;if(entradas[h.escala]>0){entradas[h.escala]--;return}visto.add(k+o._id);
      const dest=porCode[h.para];(m[o._id]??=[]).push({nome:h.nome,motivo:dest&&dest.tipo==="cargo"?"mudança de cargo → "+h.para:"mudou p/ "+h.para})}});
  return m;
}
function calcularDia(escalas,dia,saidas,pode){
  dia={...DIA_VAZIO,...(dia||{})};const trocas=dia.trocas||[];const absQ=dia.absQtd||{};
  const gs=escalas.filter(g=>g.tipo!=="cargo"&&rotuloTurno(g.turno));const code={};gs.forEach(g=>code[g._id]=g.code);
  const movidos=new Set(trocas.filter(t=>t.pessoaId&&!t.pulmaoId).map(t=>t.pessoaId));
  const nos=gs.map(g=>{const r=rotuloTurno(g.turno);
    const folga=!!dia.folga[g._id];const aus=new Set(dia.ausentes[g._id]||[]);const ps=g.pessoas||[];
    const ausN=folga?[]:ps.filter(p=>aus.has(p.id));
    let base=folga?[]:ps.filter(p=>!aus.has(p.id)&&!movidos.has(p.id));
    const anon=folga?0:Math.min(absQ[g._id]||0,base.length);if(anon)base=base.slice(0,base.length-anon);
    const sai=folga?[]:trocas.filter(t=>t.pessoaId&&!t.pulmaoId&&t.de===g._id);
    const entra=trocas.filter(t=>t.para===g._id).map(t=>({id:t.pulmaoId||t.pessoaId||t.id,nome:t.nome,cpf:t.cpf,troca:t.id}));
    const presentes=[...base,...entra];
    const previsto=previstoDe(g);const precisa=folga?0:(dia.precisa[g._id]??previsto);
    const vagaFixa=Math.max(0,precisa-ps.length);const sd=saidas[g._id]||[];
    const vagas=Array.from({length:vagaFixa},(_,i)=>({tipo:"vaga",...(sd[i]||{nome:null})}));
    const motivos=[...ausN.map(p=>({tipo:"abs",pessoa:p})),...Array.from({length:anon},()=>({tipo:"abs",pessoa:null})),...sai.map(t=>({tipo:"troca",nome:t.nome,para:code[t.para]||"?"})),...vagas];
    return {id:g._id,g,hora:r.ord,label:r.label,presentes,ausentes:ausN,anon,abs:ausN.length+anon,precisa,previsto,hc:ps.length,vagaFixa,vagas,motivos,saldo:presentes.length-precisa,falta:Math.max(0,precisa-presentes.length),folga}});
  const horas=[...new Set(nos.map(n=>n.hora))].sort((a,b)=>a-b);
  const presentesIds=new Set(nos.flatMap(n=>n.presentes.map(p=>p.id)));
  const todos=nos.flatMap(n=>(n.g.pessoas||[]).map(p=>({...p,code:n.g.code,label:n.label,hora:n.hora,gid:n.id})));
  const usadosP=new Set(trocas.filter(t=>t.pulmaoId).map(t=>t.pulmaoId));
  const pulmaoTodo=(dia.extras||[]).filter(x=>x.pessoaId?!presentesIds.has(x.pessoaId):!nos.some(n=>n.presentes.some(p=>!p.troca&&norm(p.nome)===norm(x.nome))))
    .map(x=>x.hora!=null?{...x,horas:horas.filter(d=>pode(x.hora,d))}:x);
  const pulmao=pulmaoTodo.filter(x=>!usadosP.has(x.id));
  const res=resolverCobertura(nos.filter(n=>!n.folga),pulmao,pode);
  const byId=Object.fromEntries(nos.map(n=>[n.id,n]));
  const pend=trocas.filter(t=>!t.feito).length;
  const pendMeli=(dia.pend||[]).filter(p=>p.propria?!p.feito:!(p.trocaId&&trocas.some(t=>t.id===p.trocaId))).length;
  const abertos=nos.reduce((s,n)=>s+n.falta,0);
  const sem=res.semCobertura.reduce((s,x)=>s+x.faltam,0);
  return {dia,nos,horas,presentesIds,todos,pulmao,pulmaoTodo,res,byId,trocas,pend,pendMeli,abertos,sem,
    vagasFixas:nos.reduce((s,n)=>s+(n.folga?0:n.vagaFixa),0),abs:nos.reduce((s,n)=>s+n.abs,0)};
}
/* opções para tapar o furo de uma escala: pulmão e sobras não abrem furo; puxar de escala completa abre */
function opcoesPara(n,calc,pode){
  const ok=h=>pode(h,n.hora);const dist=h=>Math.abs(h-n.hora);
  const pul=calc.pulmao.filter(x=>x.hora!=null?ok(x.hora):(x.horas||[]).includes(n.hora)).sort((a,b)=>dist(a.hora??n.hora)-dist(b.hora??n.hora));
  const outras=calc.nos.filter(m=>m.id!==n.id&&!m.folga&&ok(m.hora)&&m.presentes.some(p=>!p.troca)).sort((a,b)=>dist(a.hora)-dist(b.hora)||b.saldo-a.saldo);
  return {pul,sobra:outras.filter(m=>m.saldo>0),puxar:outras.filter(m=>m.saldo<=0)};
}

function textoCobertura(data,calc,rot){
  const {res,trocas}=calc;const nm=id=>calc.byId[id]?calc.byId[id].g.code:"pulmão";
  let t=`*COBERTURA – ${fmtData(data)}*\n`;
  if(trocas.length){t+=`\n*TROCAS / ATRIBUIR NA MELI*\n`;trocas.forEach(x=>{t+=`${x.feito?"✅":"▫️"} ${x.nome}${x.cpf?" — "+x.cpf:""}: ${x.pulmaoId?"pulmão":"era da "+nm(x.de)} → ${nm(x.para)} — De ${dm(data)} Até ${dm(data)}\n`})}
  res.cadeias.forEach((c,i)=>{
    t+=`\n*SUGESTÃO ${i+1}*\n${motNome(c.furo.mot)} — ${rot(c.furo.no)} — ${motTag(c.furo.mot)}\n`;
    let ant=motAnt(c.furo.mot);
    c.passos.forEach(p=>{t+=`${p.pessoa.nome} — ${passoDe(p,rot)} → assume ${ant}\n`;ant="posição de "+p.pessoa.nome});
    t+=`✓ Cadeia fechada\n`;
  });
  t+=calc.sem?`\n⚠ QUADRO NÃO FECHADO — permanece${calc.sem>1?"m":""} ${calc.sem} posição(ões) sem cobertura: ${res.semCobertura.map(x=>`${rot(x.no)} (${x.motivos.map(motNome).join(", ")})`).join("; ")}`:calc.abertos?`\n✓ Dá para fechar o quadro com a sugestão (${res.movs} movimentação(ões))`:`\n✓ QUADRO FECHADO`;
  return t;
}

function VagasFixas({nos,compacto}){
  const inc=nos.filter(n=>!n.folga&&n.vagaFixa>0);
  if(!inc.length)return html`<div class="text-[13px] text-muted">Todas as escalas de hoje estão completas.</div>`;

    <${Pill} tom="red">${n.vagaFixa} a menos</${Pill}></div>`)}</div>`;

/* ---- LANÇAR O DIA: ABS por escala, escalas com gente a menos e trocas ---- */

  const [gAbs,setGAbs]=useState("");const [qAbs,setQAbs]=useState(1);

  const ajAbs=(gid,d)=>{const gg=nos.find(n=>n.id===gid);log({tipo:"ABS ajustado",nome:"Escala "+(gg?gg.g.code:""),escala:gg?gg.g.code:"",detalhe:`ABS: ${gg?gg.abs:0} → ${Math.max(0,(gg?gg.abs:0)+d)}`});mudar(x=>{const v=Math.max(0,((x.absQtd||{})[gid]||0)+d);const a={...(x.absQtd||{})};if(v)a[gid]=v;else delete a[gid];return {...x,absQtd:a}})};
  const comAbs=nos.filter(n=>n.abs>0);

  const achados=useMemo(()=>{const t=norm(q.trim());const d=dg(q);if(t.length<2||sel)return [];
    return calc.todos.filter(p=>norm(p.nome).includes(t)||(d.length>=3&&dg(p.cpf).includes(d))).slice(0,6)},[q,calc.todos,sel]);
  const jaTrocado=sel&&calc.trocas.some(t=>t.pessoaId===sel.id&&!t.pulmaoId);
  const addTroca=()=>{if(!sel||!para||para===sel.gid||jaTrocado)return;const gg=nos.find(n=>n.id===para);log({tipo:"Troca lançada",nome:sel.nome,cpf:sel.cpf,escala:sel.code,para:gg?gg.g.code:""});
    mudar(x=>({...x,trocas:[...(x.trocas||[]),{id:"t"+Date.now().toString(36),pessoaId:sel.id,nome:sel.nome,cpf:sel.cpf||"",de:sel.gid,para,feito:false}]}));setQ("");setSel(null);setPara("")};

  return html`<${Card} title="Lançar o dia">

      <span class="inline-flex items-center rounded-full border border-line text-[13px]"><button type="button" aria-label="Menos" onClick=${()=>setQAbs(v=>Math.max(1,v-1))} class="w-8 h-9 font-bold" style=${{color:"var(--accent)"}}>−</button><b class="tnum min-w-[22px] text-center">${qAbs}</b><button type="button" aria-label="Mais" onClick=${()=>setQAbs(v=>v+1)} class="w-8 h-9 font-bold" style=${{color:"var(--accent)"}}>+</button></span>
      <${BtnPrim} disabled=${!gAbs} onClick=${addAbs}>Lançar ABS</${BtnPrim}>
    </div>`}
    ${comAbs.length?comAbs.map(n=>html`<div key=${n.id} class="flex items-center gap-2 py-1.5 border-t border-[var(--sep)] first:border-t-0 text-[13px]">
      <span class="min-w-0 flex-1"><b class="font-display tnum">${n.g.code}</b> <span class="text-muted">· ${n.label}</span>${n.ausentes.length?html`<span class="block text-[11px] text-muted">com nome: ${n.ausentes.map(p=>p.nome).join(", ")}</span>`:null}</span>

  </${Card}>`;
}

function FuroItem({n,calc,pode,mudar,podeEditar,log=()=>{}}){

/* ============ ABS POR NOME · COBERTURA EM CADEIA ============
   Lança quem faltou pelo nome. O painel acha a escala da pessoa e pede quem cobre.
   Se quem cobre veio de outra escala, abre o furo lá e pede a próxima pessoa, até fechar. */
function passosCadeia(c,calc){
  const tr=[];for(const id of (c.trocas||[])){const t=calc.trocas.find(z=>z.id===id);if(!t)break;tr.push(t)}
  let alvo=c.gid,lugar=c.nome;tr.forEach(t=>{alvo=t.pulmaoId?null:t.de;lugar=t.nome});
  const n=alvo?calc.byId[alvo]:null;
  const ausente=((calc.dia.ausentes||{})[c.gid]||[]).includes(c.pessoaId);
  const estado=!ausente?"desmarcada":!alvo?"pulmao":(!n||n.folga)?"fechada":n.saldo>=0?"completa":"aberta";
  return {tr,alvo,n,lugar,estado};
}
const nidT=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

    s+=st.estado==="aberta"?`   ⚠ falta cobrir na ${st.n.g.code} (lugar de ${st.lugar})\n`:st.estado==="desmarcada"?`   (falta desmarcada)\n`:`   ✓ cadeia fechada\n`});return s};
  const copiar=async()=>{try{await navigator.clipboard.writeText(texto());toast("Copiado.")}catch(e){toast("Não deu para copiar aqui.",true)}};
  const EST={aberta:["red","falta cobrir"],pulmao:["green","fechada"],completa:["green","fechada"],fechada:["muted","encerrada"],desmarcada:["muted","falta desmarcada"]};
  return html`<${Card} className="md:col-span-12" title="ABS do dia · cobertura em cadeia" right=${cadeias.length?html`<span class="flex items-center gap-2"><${Pill} tom=${abertas?"red":"green"}>${abertas?abertas+" em aberto":"tudo coberto"}</${Pill}><${BtnMini} onClick=${copiar}>Copiar</${BtnMini}></span>`:null}>
    <div class="text-[12px] text-muted mb-3 max-w-2xl">Digite quem faltou: o painel mostra a escala da pessoa e pede quem vai cobrir. Se quem cobre saiu de outra escala, abre o furo lá e o painel pede a próxima pessoa — até a cadeia fechar com alguém do pulmão ou de escala com sobra.</div>

        return html`<button type="button" key=${p.id} disabled=${!!bloq} onClick=${()=>addAbs(p)} class="w-full text-left px-3.5 py-2.5 text-[13px] border-t border-[var(--sep)] first:border-t-0 hover:bg-[var(--wash)] disabled:opacity-50 flex items-center gap-3">
          <span class="min-w-0 flex-1"><b>${p.nome}</b><span class="block text-[11px] text-muted font-mono">${p.cpf||"sem CPF"}</span></span>
          <span class="text-right shrink-0"><span class="block font-display text-[15px] tnum" style=${{color:"var(--accent)"}}>${p.code}</span><span class="block text-[11px] text-muted">${p.label}</span></span>
          ${bloq?html`<${Pill} tom="muted">${bloq}</${Pill}>`:html`<${Pill} tom="red">lançar ABS</${Pill}>`}
        </button>`})}</div>`}
      ${(t.length>=2||d.length>=3)&&!ach.length&&html`<div class="text-[12px] text-muted">Ninguém com esse nome ou CPF nas escalas.</div>`}
    </div>`}
    ${!cadeias.length?html`<div class="text-[13px] text-muted">Nenhum ABS lançado por nome neste dia.</div>`:html`<div class="grid grid-cols-1 lg:grid-cols-2 gap-3 items-start">${cadeias.map((c,i)=>{const s=estados[i];const [tom,txt]=EST[s.estado];let ant=c.nome;

/* ============ PENDÊNCIAS DA MELI (quem bateu ponto e precisa ser atribuído) ============ */
const STATUS_MELI={folga:{txt:"Dia de folga",tom:"amber"},horario:{txt:"Horário incompatível",tom:"red"},sem:{txt:"Sem solicitação",tom:"accent"}};
const statusDe=l=>/folga/i.test(l)?"folga":/incompat/i.test(l)?"horario":/sem\s*solicita/i.test(l)?"sem":null;
const hm=min=>min==null?"":`${String(Math.floor(min/60)).padStart(2,"0")}:${String(min%60).padStart(2,"0")}`;
/* linhas de texto (células separadas por tab) → [{data, nome, cpf, min, status}] */
function lerPendencias(linhas){
  const out=[];let data=null,secao=null;const anoAtual=new Date().getFullYear();const vistos=new Set();
  for(const raw of linhas){
    const l=String(raw||"").replace(/[\t ]+/g," ").trim();if(!l)continue;
    const cpfM=l.match(/(\d{3})\.?(\d{3})\.?(\d{3})-?(\d{2})(?!\d)/);
    const horaM=l.match(/\b(\d{1,2}):(\d{2})(?::\d{2})?\s*h/i)||(!cpfM?null:l.match(/\b(\d{1,2}):(\d{2})\b/));
    const iso=l.match(/^(\d{4})-(\d{2})-(\d{2})/);const br=l.match(/^(?:[a-zç]{3,}\.?,?\s*)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/i);
    if(!cpfM&&!horaM&&(iso||br)){
      if(iso)data=`${iso[1]}-${iso[2]}-${iso[3]}`;
      else{let a=br[3]?+br[3]:anoAtual;if(a<100)a+=2000;data=`${a}-${String(br[2]).padStart(2,"0")}-${String(br[1]).padStart(2,"0")}`}
      secao=null;continue}
    const st=statusDe(l);
    let nome=l;if(cpfM)nome=nome.replace(cpfM[0]," ");
    nome=nome.replace(/sem dados de cpf/ig," ").replace(/\b\d{1,2}:\d{2}(:\d{2})?\s*(hs|h)?\b/ig," ")
      .replace(/dia de folga|hor[aá]rio incompat[ií]vel|sem solicita[cç][aã]o|\d*\s*solicita[cç](ão|ao|ões|oes)\s*ativas?/ig," ")
      .replace(/\s+/g," ").trim().replace(/^[-–:|]+|[-–:|]+$/g,"").trim();
    if(!cpfM&&!horaM&&st&&nome.length<3){secao=st;continue}
    if(!/[a-zà-ú]{2,}/i.test(nome)||!data)continue;
    const it={data,nome,cpf:cpfM?fmtCpf(cpfM.slice(1,5).join("")):"",min:horaM?(+horaM[1])*60+(+horaM[2]):null,status:st||secao||"sem"};
    const k=data+"|"+(dg(it.cpf)||norm(nome));if(vistos.has(k))continue;vistos.add(k);out.push(it);
  }
  return out;
}
async function lerArquivoMeli(f){
  if(/\.(xlsx|xls|ods)$/i.test(f.name)){
    if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=()=>no(new Error("Não deu para carregar o leitor de Excel"));document.head.appendChild(s)});
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});const linhas=[];
    wb.SheetNames.forEach(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}).forEach(r=>linhas.push(r.map(v=>v instanceof Date?isoDe(new Date(v.getTime()+12*3600e3)):String(v)).join("\t"))));
    return linhas;
  }
  return (await f.text()).split(/\r?\n/);
}
function acharNoHC(escalas,cpf,nome){
  const d=dg(cpf),n=norm(nome).trim();
  for(const g of escalas)for(const p of (g.pessoas||[]))if(d&&dg(p.cpf)===d)return {p,g};
  if(n)for(const g of escalas)for(const p of (g.pessoas||[]))if(norm(p.nome).trim()===n)return {p,g};
  return null;
}
function mesclarPend(dia,itens,escalas){
  dia={...DIA_VAZIO,...(dia||{})};const pend=[...(dia.pend||[])];const folga={...dia.folga};let novas=0;const folgas=[];
  itens.forEach(it=>{const k=dg(it.cpf)||norm(it.nome);if(pend.some(p=>(dg(p.cpf)||norm(p.nome))===k))return;
    pend.push({id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),nome:it.nome,cpf:it.cpf,min:it.min,status:it.status,feito:false});novas++;
    if(it.status==="folga"){const h=acharNoHC(escalas,it.cpf,it.nome);if(h&&h.g.tipo!=="cargo"&&!folga[h.g._id]){folga[h.g._id]=true;folgas.push(h.g.code)}}});
  return {dia:{...dia,pend,folga},novas,folgas};
}
/* horário de escala mais provável para uma batida (chegar antes é o normal) */
function horaRef(min,horas){if(min==null||!horas.length)return null;let best=null,bc=Infinity;
  horas.forEach(h=>{const df=h*60-min;const c=df>=0?df:-df*2;if(c<bc){bc=c;best=h}});return best}
function sugerirDestino(own,ref,calc,pode,usados,diarista){
  usados=usados||{};const r=ref??(own?own.hora:null);
  if(own&&!own.folga&&(r==null||own.hora===r))return own.id;
  if(r==null)return "";
  const cand=calc.nos.filter(n=>!n.folga&&pode(r,n.hora));
  const livre=n=>n.falta-(usados[n.id]||0);
  const quadro=n=>diarista&&n.vagaFixa>0&&livre(n)>0?1:0;
  cand.sort((a,b)=>quadro(b)-quadro(a)||(livre(b)>0)-(livre(a)>0)||Math.abs(a.hora-r)-Math.abs(b.hora-r)||a.saldo-b.saldo);
  return cand[0]?cand[0].id:"";
}

function ImportarMeli({escalas,onCancelar,onImportar}){
  const [texto,setTexto]=useState("");const [linhas,setLinhas]=useState(null);const [arq,setArq]=useState("");const [busy,setBusy]=useState(false);const [erro,setErro]=useState("");

      ${arq&&html`<span class="text-[12px] text-muted">${arq}</span><${BtnMini} onClick=${()=>{setLinhas(null);setArq("")}}>trocar por texto colado</${BtnMini}>`}
    </div>

    ${erro&&html`<div class="text-[12px]" style=${{color:"var(--red)"}}>${erro}</div>`}
    ${itens.length>0&&html`<div class="text-[12px] text-muted"><b class="text-ink">${itens.length}</b> pendência(s) em <b class="text-ink">${datas.length}</b> dia(s) · ${noHC} encontrada(s) no HC · ${itens.length-noHC} fora do HC (entram como diarista/extra)</div>

function PendenciasMeli({calc,data,mudar,escalas,pode,podeEditar,toast,log=()=>{},onImportar}){

  const aplicar=ops=>mudar(y=>({...y,extras:[...(y.extras||[]),...ops.filter(o=>o.r.extra).map(o=>o.r.extra)],trocas:[...(y.trocas||[]),...ops.filter(o=>o.r.troca).map(o=>o.r.troca)],

      if(x.hc&&movidos.has(x.hc.p.id)&&!(x.own&&x.own.id===D))return;const r=montar(x,D);if(!r)return;usados[D]=(usados[D]||0)+1;ops.push({id:x.p.id,r})});

      <div class="text-[12px] text-muted mb-3 max-w-3xl">O painel acha a escala de cada pessoa e sugere onde atribuir: na própria escala se o horário bate; senão, numa escala com furo num horário compatível com a batida. Quem estava de folga ou fora do HC entra pelo pulmão e não abre furo. Atribua na Meli com <b class="text-ink">De ${dm(data)} Até ${dm(data)}</b> e marque ✓.</div>

const chaveT=s=>norm(s).replace(/[\s.]+/g,"");

  const a=String(antiga||"").trim();if(a){const g=escalas.find(x=>String(x.code).trim()===a);if(g)return g}

/* aplica no dia: escalas de folga, "precisa" pelo quadro da HC_PLAN e os ABS (F/AT) com cadeia de cobertura */
const pegaAbs=(a,...ks)=>{if(!a||typeof a!=="object")return "";for(const k of ks){if(a[k]!=null&&String(a[k]).trim()!=="")return String(a[k]).trim()}const mapa=Object.fromEntries(Object.entries(a).map(([k,v])=>[norm(k).replace(/[^a-z0-9]/g,""),v]));for(const k of ks){const v=mapa[norm(k).replace(/[^a-z0-9]/g,"")];if(v!=null&&String(v).trim()!=="")return String(v).trim()}return ""};
function normAbs(a){if(Array.isArray(a))a={nome:a[0],cpf:a[1],codigo:a[2],turno:a[3],groot:a[4]};if(typeof a==="string")a={nome:a};a=a||{};
  return {...a,nome:pegaAbs(a,"nome","Nome","NOME","nome completo","colaborador","Colaborador","COLABORADOR","funcionario","funcionário","name","pessoa","employee","nome_colaborador","nomeFuncionario","nome_funcionario","full_name","fullName"),groot:pegaAbs(a,"groot","groot id","groot_id","grootId","id colaborador","id_colaborador","matricula","matrícula"),cpf:pegaAbs(a,"cpf","CPF","Cpf","documento"),
    antiga:pegaAbs(a,"antiga","escala","Escala","ESCALA","codigoEscala"),codigo:pegaAbs(a,"codigo","código","Codigo","status","Status","cod","tipo","motivo").toUpperCase(),
    turno:pegaAbs(a,"turno","Turno"),hora:pegaAbs(a,"horario","Horário","hora","entrada").slice(0,5),linha:pegaAbs(a,"linha","row","Linha")}}
function aplicarPlanilha(dia,r,escalas){
  dia={...DIA_VAZIO,...(dia||{})};r={...r,abs:(r.abs||[]).map(normAbs)};
  try{const bruto=r._absBruto||[];const sem=r.abs.map((a,i)=>(!a.nome&&!a.cpf)?bruto[i]:null).filter(x=>x!=null);if(sem.length)console.warn("[Painel KN] ABS da planilha sem nome/CPF ("+sem.length+"):",JSON.stringify(sem.slice(0,5)))}catch(_){}

    if(!g){const hp=(r.hcplan||[]).find(x=>chaveT(x.turno)===k);if(hp)g=ops.find(x=>String(x.code).trim()===String(hp.antiga).trim())||null}return g||null};

  (r.abs||[]).forEach(a=>{const porId=buscarPorGroot(a);if(porId&&!a.nome)a.nome=porId.p.nome;if(porId&&!a.cpf)a.cpf=porId.p.cpf||"";if(!a.nome&&!a.cpf){semId.push(a);return}const h=porId||acharNoHC(ops,a.cpf,a.nome);
    if(h)naPlan.set(h.p.id,a.codigo||"");

    if(retirados.has(h.p.id)){ignorados.push({nome:h.p.nome,codigo:a.codigo,motivo:"ABS retirado à mão no painel"});return}

/* ============ GRUPOS OFICIAL · CONSULTA PROTEGIDA E SOMENTE LEITURA ============ */
const KN_GRUPOS_TABELA="kn_grupos_sync";
async function lerGruposOficiais(){
  const c=await nuvem(),todos=[];
  for(let inicio=0;inicio<10000;inicio+=500){
    const {data,error}=await c.from(KN_GRUPOS_TABELA)
      .select("groot_id,nome,matricula,coordenador,escala_descricao,escala,turma,escala_antiga,horario")
      .order("groot_id",{ascending:true}).range(inicio,inicio+499);
    if(error)throw new Error(error.message||"Consulta à base GRUPOS não autorizada");
    todos.push(...(data||[]));if(!data||data.length<500)break;
  }
  return todos;
}
/* ============ SINCRONIA AUTOMÁTICA COM A PLANILHA (sem login) ============
   1) GRUPOS → escalas: quem entrou, saiu ou mudou de escala na aba GRUPOS muda sozinho aqui.
   2) Presença KN → ABS do dia: puxa da planilha em segundo plano, mesmo fora da aba Cobertura.
   3) "Aviso" da planilha (escpainel:ping): o Apps Script grava essa chave a cada edição e o painel puxa na hora. */
const K_GSYNC="escpainel:gruposync",K_ASYNC="escpainel:abssync",K_PING="escpainel:ping";
const GRUPOS_MIN=10*60e3, ABS_MIN=2*60e3;
const hashTxt=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const toks=s=>norm(s).replace(/[^a-z ]/g," ").split(/\s+/).filter(t=>t.length>1&&!["de","da","do","dos","das","e"].includes(t));
const chaveCurta=s=>{const t=toks(s);return t.length>1?t[0]+" "+t[t.length-1]:t[0]||""};
/* trava simples entre aparelhos: só um faz a sincronia por vez */
async function pegarVez(chave,intervalo,forcar){
  let st=null;try{st=await lerChave(chave)}catch(e){}
  const agora=Date.now();
  if(st&&st.rodando&&agora-new Date(st.rodando).getTime()<(forcar?30e3:90e3))return null;
  if(!forcar&&st&&st.em&&agora-new Date(st.em).getTime()<intervalo)return null;
  await salvarChave(chave,{...(st||{}),rodando:new Date().toISOString()});return st||{};
}
function escalaDaLinha(escalas,r){
  return acharEscala(escalas,r.escala_antiga,r.escala_descricao)||acharEscala(escalas,r.escala,r.turma)||acharEscala(escalas,"",r.escala)||null;
}
/* compara a GRUPOS com as escalas e devolve o que precisa mudar */
function planoGrupos(escalas,linhas){
  const porGroot=new Map(),porNome=new Map(),porCurto=new Map();
  escalas.forEach(g=>(g.pessoas||[]).forEach(p=>{const it={p,g};
    if(p.groot)porGroot.set(String(p.groot).trim(),it);
    const n=norm(p.nome).trim();porNome.set(n,porNome.has(n)?null:it);
    const c=chaveCurta(p.nome);porCurto.set(c,porCurto.has(c)?null:it)}));
  const usados=new Set(),add=[],mover=[],atualizar=[],semEscala=[],gerenciadas=new Set();
  linhas.forEach(r=>{const groot=String(r.groot_id||"").trim();const nome=String(r.nome||"").trim();if(!nome)return;
    const g=escalaDaLinha(escalas,r);if(!g){semEscala.push(r);return}gerenciadas.add(g._id);
    let ach=(groot&&porGroot.get(groot))||porNome.get(norm(nome).trim())||porCurto.get(chaveCurta(nome))||null;
    if(ach&&usados.has(ach.p.id))ach=null;
    if(!ach){add.push({g,pessoa:{id:novoId(),nome,cpf:"",groot,matricula:String(r.matricula||"")}});return}
    usados.add(ach.p.id);
    const novo={...ach.p,groot:groot||ach.p.groot||"",matricula:String(r.matricula||ach.p.matricula||"")};
    const mudouNome=groot&&ach.p.groot===groot&&norm(ach.p.nome).trim()!==norm(nome).trim();if(mudouNome)novo.nome=nome;
    if(ach.g._id!==g._id)mover.push({de:ach.g,para:g,antes:ach.p,pessoa:novo});
    else if(novo.groot!==(ach.p.groot||"")||novo.matricula!==(ach.p.matricula||"")||mudouNome)atualizar.push({g,antes:ach.p,pessoa:novo,mudouNome});
  });
  const remover=[];escalas.forEach(g=>{if(!gerenciadas.has(g._id))return;(g.pessoas||[]).forEach(p=>{if(!usados.has(p.id))remover.push({g,p})})});
  return {add,mover,atualizar,remover,semEscala};
}
async function sincronizarGrupos(escalas,{forcar=false}={}){
  if(!escalas.length)return null;
  const st=await pegarVez(K_GSYNC,GRUPOS_MIN,forcar);if(!st)return null;
  const fim=async extra=>{await salvarChave(K_GSYNC,{...st,...extra,rodando:null,em:new Date().toISOString()})};
  try{
    const linhas=await lerGruposOficiais();
    const hash=hashTxt(JSON.stringify(linhas.map(r=>[r.groot_id,r.nome,r.escala_antiga,r.escala_descricao,r.escala]).sort()));
    if(!forcar&&hash===st.hash){await fim({});return {igual:true,total:linhas.length}}
    const pl=planoGrupos(escalas,linhas);
    const totalPessoas=escalas.reduce((s,g)=>s+(g.pessoas||[]).length,0);
    /* trava: se a GRUPOS veio vazia ou bem menor (planilha quebrada), não tira ninguém */
    const suspeita=linhas.length<20||(st.total&&linhas.length<st.total*0.8)||pl.remover.length>Math.max(10,totalPessoas*0.15);
    const remover=suspeita?[]:pl.remover;
    const porEsc={};const de=id=>(porEsc[id]??={add:[],tirar:new Set(),troca:new Map()});
    pl.add.forEach(a=>de(a.g._id).add.push(a.pessoa));
    pl.mover.forEach(m=>{de(m.de._id).tirar.add(m.antes.id);de(m.para._id).add.push(m.pessoa)});
    pl.atualizar.forEach(u=>de(u.g._id).troca.set(u.antes.id,u.pessoa));
    remover.forEach(r=>de(r.g._id).tirar.add(r.p.id));
    for(const [id,o] of Object.entries(porEsc)){
      await alterarEscala(id,x=>{const ids=new Set((x.pessoas||[]).map(p=>p.id));
        return {...x,pessoas:[...(x.pessoas||[]).filter(p=>!o.tirar.has(p.id)).map(p=>o.troca.get(p.id)||p),...o.add.filter(p=>!ids.has(p.id))]}})}
    const ev=[];
    pl.add.forEach(a=>ev.push({tipo:"Adicionado",nome:a.pessoa.nome,escala:a.g.code,detalhe:"entrou pela aba GRUPOS"+(a.pessoa.groot?" · Groot "+a.pessoa.groot:"")}));
    pl.mover.forEach(m=>ev.push({tipo:"Mudou de escala",nome:m.pessoa.nome,cpf:m.pessoa.cpf||"",escala:m.de.code,para:m.para.code,detalhe:"mudança feita na aba GRUPOS"}));
    pl.atualizar.filter(u=>u.mudouNome).forEach(u=>ev.push({tipo:"Editado",nome:u.pessoa.nome,escala:u.g.code,detalhe:`nome: ${u.antes.nome} → ${u.pessoa.nome} (GRUPOS)`}));
    remover.forEach(r=>ev.push({tipo:"Removido",motivo:"Saiu da GRUPOS",nome:r.p.nome,cpf:r.p.cpf||"",escala:r.g.code,escalaId:r.g._id,pessoa:r.p}));
    if(suspeita&&pl.remover.length)ev.push({tipo:"GRUPOS com problema",nome:"Aba GRUPOS",detalhe:`${pl.remover.length} pessoa(s) sumiriam de uma vez (a GRUPOS veio com ${linhas.length} linha(s)). Por segurança ninguém foi tirado.`});
    for(const e of ev){try{await registrar({area:"grupos",...e})}catch(_){}}
    await fim({hash,total:linhas.length,semEscala:pl.semEscala.map(r=>({nome:r.nome,groot:r.groot_id,escala:r.escala_antiga||r.escala_descricao||r.escala||""})).slice(0,200),
      ultimo:{add:pl.add.length,mover:pl.mover.length,remover:remover.length,bloqueados:suspeita?pl.remover.length:0,em:new Date().toISOString()}});
    return {total:linhas.length,add:pl.add.length,mover:pl.mover.length,remover:remover.length,bloqueados:suspeita?pl.remover.length:0};
  }catch(e){await fim({erro:e.message||String(e)}).catch(()=>{});throw e}
}
/* ABS do dia de hoje, em segundo plano */
async function sincronizarAbsHoje(escalas,{forcar=false}={}){
  if(!escalas.length)return null;
  const st=await pegarVez(K_ASYNC,ABS_MIN,forcar);if(!st)return null;
  const hoje=hojeISO();
  try{const cfg=await cfgPlanilha();if(!cfg||!cfg.url){await salvarChave(K_ASYNC,{rodando:null,em:new Date().toISOString()});return null}
    const r=await chamarPlanilha(cfg,hoje);if(!r||!r.ok)throw new Error(r&&r.erro||"A planilha não respondeu");r._absBruto=r.abs;
    const dia=await lerChave(K_DIA+hoje);const x=aplicarPlanilha(dia,r,escalas);
    await salvarChave(K_DIA+hoje,{...x.dia,em:new Date().toISOString()});
    if(x.nAbs||x.removidos.length||x.alertaNovo){try{await registrar({area:"cobertura",dia:hoje,tipo:x.alertaNovo?"Planilha com problema":"Planilha puxada",nome:"Headcount KN 2026 (automático)",
      detalhe:x.alertaNovo?`marcação caiu de ${x.alerta.antes} para ${x.alerta.agora} — ABS congelados`:`${x.nAbs} ABS novo(s)${x.removidos.length?" · voltou a presença: "+x.removidos.map(m=>m.nome).join(", "):""}`})}catch(_){}}
    await salvarChave(K_ASYNC,{rodando:null,em:new Date().toISOString(),abs:(r.abs||[]).length});
    return {abs:(r.abs||[]).length,novos:x.nAbs,removidos:x.removidos.length};
  }catch(e){await salvarChave(K_ASYNC,{rodando:null,em:new Date().toISOString(),erro:e.message||String(e)}).catch(()=>{});throw e}
}
